<section id="contact" class="section">
  <div class="container container-narrow">
    <h3 class="text-center">Contact</h3>
    <p class="lede text-center">Open to backend roles, API work, and design-led engineering.</p>
    <form class="mt-3" method="post" action="https://formspree.io/f/your-id">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" placeholder="Your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" name="message" rows="5" placeholder="Tell me about your project" required></textarea>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Send</button>
        <a class="btn btn-ghost" href="https://linkedin.com" target="_blank" rel="noopener"><i class="bi bi-linkedin"></i> LinkedIn</a>
      </div>
    </form>
  </div>
</section>
